<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: transparent;
    display: flex;
    justify-content: center;
    padding: 20px;
    -webkit-font-smoothing: antialiased;
  }
  .popover {
    width: 300px;
    background: #ffffff;
    border-radius: 12px;
    border: 1px solid #e5e7eb;
    overflow: hidden;
  }
  .popover-header {
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #f3f4f6;
  }
  .app-icon {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 600;
    color: white;
  }
  .app-info .name {
    font-size: 14px;
    font-weight: 600;
    color: #111;
  }
  .app-info .version {
    font-size: 11px;
    color: #9ca3af;
  }
  .sync-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 500;
    color: #15803d;
  }
  .sync-status .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #22c55e;
  }
  .status-section {
    padding: 14px 18px;
    border-bottom: 1px solid #f3f4f6;
  }
  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .status-row:last-child { margin-bottom: 0; }
  .status-label {
    font-size: 12px;
    color: #6b7280;
  }
  .status-value {
    font-size: 12px;
    color: #111;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .progress-bar {
    width: 100%;
    height: 4px;
    background: #f3f4f6;
    border-radius: 2px;
    margin-top: 10px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #7c3aed, #a855f7);
    border-radius: 2px;
    width: 100%;
  }
  .progress-label {
    font-size: 11px;
    color: #9ca3af;
    margin-top: 4px;
  }
  .actions {
    padding: 8px;
  }
  .action-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
    color: #333;
    cursor: pointer;
    transition: all 0.15s;
  }
  .action-btn:hover {
    background: #f3f4f6;
  }
  .action-btn .icon {
    width: 28px;
    height: 28px;
    background: #f3f4f6;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .action-btn.primary .icon {
    background: #f0ebff;
    color: #7c3aed;
  }
  .action-btn .label {
    flex: 1;
  }
  .action-btn .shortcut {
    font-size: 11px;
    color: #9ca3af;
    font-family: 'SF Mono', monospace;
  }
  .divider {
    height: 1px;
    background: #f3f4f6;
    margin: 0 8px;
  }
</style>
</head>
<body>
<div class="popover">
  <div class="popover-header">
    <div class="app-icon">R</div>
    <div class="app-info">
      <div class="name">Remindian</div>
      <div class="version">v5.6.0</div>
    </div>
    <div class="sync-status"><span class="dot"></span> Synced</div>
  </div>
  <div class="status-section">
    <div class="status-row">
      <span class="status-label">Last sync</span>
      <span class="status-value">2 minutes ago</span>
    </div>
    <div class="status-row">
      <span class="status-label">Tasks synced</span>
      <span class="status-value">247</span>
    </div>
    <div class="status-row">
      <span class="status-label">Obsidian &rarr; Reminders</span>
      <span class="status-value">189</span>
    </div>
    <div class="status-row">
      <span class="status-label">Reminders &rarr; Obsidian</span>
      <span class="status-value">58</span>
    </div>
    <div class="progress-bar"><div class="progress-fill"></div></div>
    <div class="progress-label">Sync complete : no errors</div>
  </div>
  <div class="actions">
    <div class="action-btn primary">
      <span class="icon">&#8635;</span>
      <span class="label">Sync Now</span>
      <span class="shortcut">&#8984;S</span>
    </div>
    <div class="action-btn">
      <span class="icon">&#9881;</span>
      <span class="label">Open Main Window</span>
      <span class="shortcut">&#8984;O</span>
    </div>
    <div class="divider"></div>
    <div class="action-btn">
      <span class="icon">&#8505;</span>
      <span class="label">About Remindian</span>
    </div>
    <div class="action-btn">
      <span class="icon" style="font-size:12px;">&#9724;</span>
      <span class="label">Quit</span>
      <span class="shortcut">&#8984;Q</span>
    </div>
  </div>
</div>
</body>
</html>
